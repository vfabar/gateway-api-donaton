server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          use-framework-retry-filter: true
          routes:
            - id: logistica-api
              uri: ${LOGISTICA_API_URI:http://logistica-service:3001}
              predicates:
                - Path=/api/logistica/**
              filters:
                - StripPrefix=2
                - Retry=2

            - id: donaciones-api
              uri: ${DONACIONES_API_URI:http://donaciones-service:3002}
              predicates:
                - Path=/api/donaciones/**
              filters:
                - StripPrefix=2
                - Retry=2

            - id: necesidades-api
              uri: ${NECESIDADES_API_URI:http://necesidades-service:3003}
              predicates:
                - Path=/api/necesidades/**
              filters:
                - StripPrefix=2
                - Retry=2
